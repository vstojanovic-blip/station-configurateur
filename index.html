// BESS warning messages
function bessWarnings(bess, bessType, cp, gridKVA, mx) {
  const msgs = [];
  // Message 1: user forced 1C
  if (bessType === '1C') {
    msgs.push({level:'warn', text:'Standard BESS is 0.5C. Make sure your use case fits 1C (space constraint, weak grid).'});
  }
  // Message 2: 0.5C would need 2+ more cabinets than 1C
  if (bessType !== '1C' && bess&&bess.s === 'bess_ok') {
    const gap = electraPromise(cp) * cp - gridKVA;
    if (gap > 0) {
      const cabs05 = Math.ceil(gap / BESS_SPEC['0.5C'].kw);
      const cabs1c = Math.ceil(gap / BESS_SPEC['1C'].kw);
      if (cabs05 - cabs1c >= 2) {
        msgs.push({level:'info', text:"0.5C requires "+cabs05+" cabinets vs "+cabs1c+" for 1C - consider switching to 1C, the cost difference doesn't justify the extra cabinet"+(cabs05-cabs1c>1?"s":"")+"."});
      }
    }
  }
  return msgs;
}


// Shared alpiCfg  -  dispenser-count based (1 dispenser = 2 spots, max 4 dispensers/8 spots per unit).
// Spots are split as evenly as possible across units=ceil(cp/8). A unit sized to 4 dispensers
// (7-8 spots) needs HYC1000 to power all four at full rate; a unit with fewer dispensers (<=3,
// i.e. <=6 spots) only needs HYC750. gridKVA is accepted for call-site compatibility but no
// longer used - the model choice is a fixed hardware rule, not power-target driven.
function alpiCfgBE(cp, gridKVA) {
  const units = Math.ceil(cp / 8);
  const base = Math.floor(cp / units);
  const remainder = cp - base * units; // this many units get one extra spot
  let n1000 = 0, n750 = 0;
  for (let i = 0; i < units; i++) {
    const spotsInUnit = i < remainder ? base + 1 : base;
    const dispInUnit = Math.ceil(spotsInUnit / 2);
    if (dispInUnit >= 4) n1000++; else n750++;
  }
  const total = n1000 * 1000 + n750 * 750;
  const model = n750 === 0 ? 'HYC1000' : n1000 === 0 ? 'HYC750' : 'mixed';
  return { n1000, n750, total, units, model };
}

// Number of Alpi units that stay physically the same but get upgraded from 750kW to 1000kW
// rating (extra power stacks added inside the same cabinet) between two station sizes.
// iGrid/fGrid: the grid subscription (kVA) available in each phase, used to size the units
// against real available power rather than the bare Electra promise.
function alpiStackUpgrade(iCP, fCP, iGrid, fGrid) {
  const ci = alpiCfgBE(iCP, iGrid||0), cf = alpiCfgBE(fCP, fGrid||0);
  if (ci.units !== cf.units) return 0;
  return Math.max(0, Math.min(ci.n750, cf.n1000 - ci.n1000));
}


// Returns APU arch string for station code: "750APU2", "APU1" (pure HYC1000), or "750APU1-APU1" (mixed)
// gridKVA: grid subscription available - sizing targets max(Electra promise, grid) so that
// HYC1000 units get used whenever the grid connection actually supports the extra power.
function alpiArchStr(cp, gridKVA) {
  const c = alpiCfgBE(cp, gridKVA||0);
  if (c.n750 > 0 && c.n1000 > 0) return `750APU${c.n750}-APU${c.n1000}`;
  if (c.n1000 > 0) return `APU${c.n1000}`;
  return `750APU${c.n750}`;
}

function alpiModel(cp, gridKVA) {
  const c = alpiCfgBE(cp, gridKVA||0);
  return c.model === 'mixed' ? 'MIX' : c.model === 'HYC750' ? 'HYC750' : 'HYC1000';
}
function alpiLabel(cp, gridKVA) {
  const c = alpiCfgBE(cp, gridKVA||0);
  if (c.model === 'mixed') return c.n1000+'x HYC1000 + '+c.n750+'x HYC750';
  return c.units+'x '+c.model;
}

// Rule: (grid + BESS_kW) / spots >= promesse(spots)
//   -> gap = promesse(spots) x spots - grid

//   -> if gap > 0 : size BESS to cover gap (0.5C default, 1C if forced/impossible)
//   -> 12h recharge rule: (cabs x kWh) / gridKVA <= 12
//   -> if impossible : config not viable
//   -> No mixing types on site (extension locks type from finalCP)
// ===============================================================================

// -- Standard config footnote generator --
function getStdConfigFootnote(country, finalCP, hw, reco) {
  const arch = hw === 'alpi' ? 'ap' : 'hw';
  const stdCp = STANDARD_CONFIGS[country]?.[finalCP]?.[arch];
  if (!stdCp) return null;

  const actionable   = [];
  const infoOnly     = [];
  const autoAdjusts  = [];

  const recoTf = reco.tf?.isLV ? 'LV' : reco.tf?.kva ? 'MV ' + reco.tf.kva : reco.transfoKVA ? 'MV ' + reco.transfoKVA : null;
  const stdTf = stdCp.transfo;
  const tfMatch = recoTf && (
    (stdCp.isLV && reco.tf?.isLV) ||
    (!stdCp.isLV && !reco.tf?.isLV && recoTf?.replace('MV ','').replace(' ','') === stdTf.replace('MV ','').replace(' ',''))
  );
  if (recoTf && !tfMatch) {
    actionable.push(stdCp.isLV ? 'LV connection' : 'transfo ' + stdTf);
  }

  if (hw === 'alpi' && stdCp.pu && reco.alpiModel && reco.alpiModel !== stdCp.pu) {
    infoOnly.push('APU ' + (stdCp.pu === 'MIX' ? '1x HYC1000 + 1x HYC750' : stdCp.pu));
  }

  if (tfMatch && reco.gSub !== stdCp.grid) {
    actionable.push('grid ' + stdCp.grid + ' kW');
  } else if (!tfMatch && stdCp.grid) {
    autoAdjusts.push('grid -> ' + stdCp.grid + ' kW');
  }

  const recoBessStr = (!reco.bess || reco.bess.s === 'no_bess') ? null : reco.bess.mod + 'x' + reco.bess.ty;
  const stdBessStr  = stdCp.bess ? stdCp.bess.mod + 'x' + stdCp.bess.ty : null;
  if (recoBessStr !== stdBessStr) {
    const bessLabel = stdBessStr ? stdBessStr + ' BESS' : 'no BESS';
    const hasSomethingActionable = !tfMatch || (tfMatch && reco.gSub !== stdCp.grid);
    if (hasSomethingActionable) {
      autoAdjusts.push(bessLabel);
    } else {
      infoOnly.push(bessLabel);
    }
  }

  if (actionable.length === 0 && infoOnly.length === 0) return null;

  const parts = [];
  if (actionable.length)  parts.push('Select: ' + actionable.join(', '));
  if (infoOnly.length)    parts.push('FYI: ' + infoOnly.join(', '));
  if (autoAdjusts.length) parts.push('Auto: ' + autoAdjusts.join(', '));

  return 'Standard configs (' + finalCP + ' spots) - ' + parts.join(' . ') + '.';
}

function electraPromise(cp) {
  if (cp <= 4)  return 150;
  if (cp <= 6)  return 120;
  if (cp <= 12) return 90;
  return 80;
}

// calcBESS: cp = number of charging points, gridKVA = subscribed grid power
function calcBESS(cp, gridKVA, allowed, mx, forceType, ct) {
  const promise = electraPromise(cp);
  const needed  = promise * cp;
  const gap     = needed - gridKVA;

  if (!allowed) {
    if (gap <= 0) return {s:'no_bess'};
    return {s:'impossible', reason:'BESS disabled  -  grid below Electra promise'};
  }
  if (gap <= 0) return {s:'no_bess'};

  const tryT = (ty) => {
    const sp = BESS_SPEC[ty];
    const m = Math.ceil(gap / sp.kw);
    if (m <= mx && gridKVA > 0 && (m * sp.kwh) / gridKVA <= 12)
      return {s:'bess_ok', ty, mod:m, rH:(m*sp.kwh)/gridKVA, gap, needed};
    return null;
  };

  const minCabs = Math.ceil(gap / BESS_1C.kw);

  if (forceType) {
    const r = tryT(forceType);
    if (r) return r;
    const need = Math.ceil(gap / BESS_SPEC[forceType].kw);
    return {s:'impossible', reason:`${forceType} needs ${need} cabinets to close a ${gap} kW gap, but max is ${mx}. Raise Max cabinets to ${need} or increase the grid connection.`};
  }
  const r05 = tryT('0.5C'); if (r05) return r05;
  const r1  = tryT('1C');   if (r1)  return r1;
  return {s:'impossible', reason:`Needs at least ${minCabs} cabinets (1C) to close a ${gap} kW gap, but max is ${mx}. Raise Max cabinets to ${minCabs} or increase the grid connection.`};
}

// planExtBESS: phase-1 sized on initGridKVA, phase-2 sized on finalGridKVA (subscription may increase for the extension).
// The transformer never changes between phases; the BESS type (0.5C/1C) chosen in phase 1 is locked and reused in phase 2.
function planExtBESS(initCP, finalCP, initGridKVA, finalGridKVA, allowed, mx, forceType) {
  if (!allowed) {
    const ib = calcBESS(initCP,  initGridKVA, false, mx);
    const fb = calcBESS(finalCP, finalGridKVA, false, mx);
    return {impossible: fb.s==='impossible', reason:'BESS disabled', initBess:ib, finalBess:fb};
  }
  const fbNone = calcBESS(finalCP, finalGridKVA, true, mx);
  if (fbNone.s === 'no_bess') {
    const ibNone = calcBESS(initCP, initGridKVA, true, mx);
    return {impossible:false, lockedType:null, initBess:ibNone, finalBess:fbNone};
  }
  const tryType = (ty) => {
    const fb = calcBESS(finalCP, finalGridKVA, true, mx, ty);
    if (fb.s === 'impossible') return null;
    const ib = calcBESS(initCP,  initGridKVA, true, mx, ty);
    if (ib.s === 'impossible') return null;
    return {impossible:false, lockedType:fb.s==='no_bess'?null:ty, initBess:ib, finalBess:fb};
  };
  const forced = forceType || null;
  if (forced) {
    const r = tryType(forced);
    if (r) return r;
    const fbForced = calcBESS(finalCP, finalGridKVA, true, mx, forced);
    const reasonForced = fbForced.reason || `${forced}  -  Electra promise not met for this config`;
    return {impossible:true, reason:reasonForced, initBess:{s:'no_bess'}, finalBess:{s:'impossible', reason:reasonForced}};
  }
  const r05 = tryType('0.5C'); if (r05) return r05;
  const r1  = tryType('1C');   if (r1)  return r1;
  const fbAuto = calcBESS(finalCP, finalGridKVA, true, mx);
  const reasonAuto = fbAuto.reason || 'Electra promise cannot be met  -  increase grid or reduce spots';
  return {impossible:true, reason:reasonAuto, initBess:{s:'no_bess'}, finalBess:{s:'impossible', reason:reasonAuto}};
}

function AT_autoCT(cp, hw) {

function AT_realKW(cp, avail, ct, gKVA) { return Math.round(Math.min(avail,AT_hwCap(ct,cp,gKVA||0))/cp); }

function AT_extPUCost(ct, iCP, fCP, iGrid, fGrid) {
  const added=fCP-iCP;

// -- Grid target: min(transfo, PU) --
function targetGrid(tf, ct, cp, allSubs) {
  const pu = ct==='HPU' ? Math.ceil(cp/8)*720
    : ct==='MONO' ? Math.ceil(cp/2)*400
    : alpiCfgBE(cp).total;
  const target = Math.min(tf.kva, pu);
  const above = allSubs.filter(g => g >= target);
  if (above.length > 0) return above[0];
  return allSubs[allSubs.length - 1];
}

// -- Standard transfo selection by country + CP --
function stdTransfoForCP(country, cp, transfos) {
  if (cp > 16) return transfos;
  const T = {
    AT: cp <= 9  ? 'LV'      : cp <= 13 ? 'MV 1 000' : 'MV 1 600',
    BE: cp <= 13 ? 'MV 1 000': 'MV 1 600',
    CH: cp <= 9  ? 'LV'      : 'MV 1 000',
    ES: cp <= 5  ? 'LV'      : cp <= 13 ? 'MV 1 000' : 'MV 1 600',
    IT: cp <= 3  ? 'LV'      : cp <= 13 ? 'MV 1 000' : 'MV 1 600',
    FR: cp <= 5  ? 'LV'      : cp <= 13 ? 'MV 1 000' : 'MV 1 600',
    DE: cp <= 5  ? 'LV'      : cp <= 13 ? 'MV 1 000' : 'MV 1 600',
  }[country];
  if (!T) return transfos;
  const match = transfos.find(tf =>
    T === 'LV' ? tf.isLV :
    T.replace('MV ','').replace(' ','') === String(tf.kva).replace(' ','')
  );
  return match ? [match] : transfos;
}

function AT_findBest(cp, ct, hw, bOK, mx, mode) {
  const ptV=electraPromise(cp); const need=ptV*cp;
  const _atStdTf=stdTransfoForCP('AT',cp,AT_STD_TRANSFOS);
  // Compute the best no-BESS option and the best BESS option independently, then keep whichever is
  // actually cheaper - a bigger transfo is not assumed to beat a smaller transfo + BESS.
  let bestNoBess=null;
  const tryNoBess=(list)=>{
    for(const tf of list){
      const ms=targetGrid(tf,ct,cp,AT_gridSubsForTf(tf));
      if(ms<need)continue;
      const cx=AT_calcCX(cp,tf,ms,ct,{s:'no_bess'});
      const n10=cx.total;
      const score=mode==='reco'?cx.total:n10;
      if(!bestNoBess||score<(mode==='reco'?bestNoBess.capex:bestNoBess.net10))bestNoBess={tf,gSub:ms,bess:{s:'no_bess'},capex:cx.total,net10:n10};
    }
  };
  tryNoBess(_atStdTf);
  if(!bestNoBess)tryNoBess(AT_TRANSFOS);
  let bestBess=null;
  if(bOK){
    const tryBess=(list)=>{
      for(const tf of list){
        for(const ms of AT_gridSubsForTf(tf)){
          const b=calcBESS(cp,ms,true,mx,null,ct);if(b.s==='impossible')continue;
          const cx=AT_calcCX(cp,tf,ms,ct,b);
          const netB=b.s==='bess_ok'&&b.mod&&b.ty?AT_NET_OPEX[b.ty]*b.mod:0;
          const n10=cx.total-netB*10;
          const score=mode==='reco'?cx.total:n10;
          if(!bestBess||score<(mode==='reco'?bestBess.capex:bestBess.net10))bestBess={tf,gSub:ms,bess:b,capex:cx.total,net10:n10};
        }
      }
    };
    tryBess(AT_STD_TRANSFOS);
    if(!bestBess)tryBess(AT_TRANSFOS);
  }
  if(!bestNoBess)return bestBess;
  if(!bestBess)return bestNoBess;
  const scoreOf=(x)=>mode==='reco'?x.capex:x.net10;
  return scoreOf(bestBess)<scoreOf(bestNoBess)?bestBess:bestNoBess;
}
const AT_findReco=(cp,ct,hw,bOK,mx)=>AT_findBest(cp,ct,hw,bOK,mx,'reco');
const AT_find10yr=(cp,ct,hw,bOK,mx)=>AT_findBest(cp,ct,hw,bOK,mx,'10yr');
function AT_buildCode(cp, ct, b, tf, gSub) {
  const arch=ct==='MONO'||ct==='MONO'?'PU0':ct==='HPU'?`HPU${AT_puCount(ct,cp)}`:alpiArchStr(cp,gSub);
  const bStr=b.s==='bess_ok'&&b.mod&&b.ty?`${b.ty}B${b.mod}`:'B0';
  return `AT-S${cp}-${arch}-${bStr}-T${tf.kva}`;
}

function CH_findBest(cp,ct,hw,bOK,mx,mode){
  const ptV=electraPromise(cp);const need=ptV*cp;

  // no-BESS candidates are only accepted if the grid alone actually delivers Electra's promise (need);
  // otherwise we escalate to the full transfo catalogue (bigger MV). We compute the best no-BESS option
  // AND the best BESS option independently, then keep whichever is actually cheaper - a bigger transfo
  // is not assumed to beat a smaller transfo + BESS.
  let bestNoBess=null;
  const tryNoBess=(list)=>{
    for(const tf of list){
      const gSub=tf.isLV?CH_LV_TARGET:targetGrid(tf,ct,cp,CH_gridSubsForTf(tf));
      if(gSub<need)continue;
      const cx=CH_calcCX(cp,tf,gSub,ct,{s:'no_bess'});
      const net10=cx.total+CH_ANN_SUB_EUR*10;
      const score=mode==='reco'?cx.total:net10;
      if(!bestNoBess||score<(mode==='reco'?bestNoBess.capex:bestNoBess.net10))bestNoBess={tf,gSub,bess:{s:'no_bess'},capex:cx.total,annualSub:CH_ANN_SUB_EUR,net10};
    }

  tryNoBess(chStdTf);

          const netBess=b.s==='bess_ok'&&b.ty&&b.mod?CH_NET_OPEX[b.ty]*b.mod:0;
          const net10=cx.total+CH_ANN_SUB_EUR*10-netBess*10;
          const score=mode==='reco'?cx.total:net10;
          if(!bestBess||score<(mode==='reco'?bestBess.capex:bestBess.net10))bestBess={tf,gSub,bess:b,capex:cx.total,annualSub:CH_ANN_SUB_EUR,net10};
        }

  }
  if(!bestNoBess)return bestBess;
  if(!bestBess)return bestNoBess;

function ES_autoCT(cp,hw){if(cp<=4)return hw==='alpi'?'MONO':'MONO';return hw==='alpi'?'APU':'HPU';}

  return{hw:hw_cost,u:c.units,label:lbl};

function ES_extPUCost(ct,iCP,fCP,iGrid,fGrid){
  const added=fCP-iCP;
  if(ct==='MONO')return Math.max(0,Math.ceil(fCP/2)-Math.ceil(iCP/2))*HYC400_STACKED;
  if(ct==='MONO')return Math.max(0,Math.ceil(fCP/2)-Math.ceil(iCP/2))*HYC400_STACKED;
  if(ct==='HPU')return Math.max(0,Math.ceil(fCP/8)-Math.ceil(iCP/8))*HPU_UNIT+(Math.ceil(fCP/2)-Math.ceil(iCP/2))*DISP_HUA;
  const ci=alpiCfgBE(iCP,iGrid||0),cf=alpiCfgBE(fCP,fGrid||0);

const ES_fullSubForHW=(ct,cp,tf)=>tf.isLV?tf.kva:Math.min(Math.ceil(ES_demand(cp,electraPromise(cp),ct)/50)*50,tf.kva);

  let bessHW=0;if(b.s==='bess_ok'&&b.ty&&b.mod){const sp=BESS_SPEC[b.ty];bessHW=b.mod*(sp.hw+sp.inst);}
  const total=eng+gCo+eDist+ch.hw+ELECTRA_BOX+fixInst+iV+bessHW;
  return{eng,gCo,eDist,chHW:ch.hw,other:ELECTRA_BOX,instFix:fixInst,instVar:iV,bess:bessHW,total,chLabel:ch.label};

function ES_findBest(cp,ct,hw,bOK,mx,mode){

function archRows(items) { return items.filter(function(x){return x!=null;}); }
function buildMergedCode(code, finalCode, gSub, finalGSub) {
  if (!code) return '';
  function normalizeParts(c) {
    const parts = c.split('-');
    const out = [];
    let i = 0;
    while (i < parts.length) {
      const p = parts[i];
      const next = parts[i+1] || '';
      if (/^\d+APU/.test(p) && /^\d+APU/.test(next)) {
        out.push(p + '-' + next);
        i += 2;
      } else {
        out.push(p);
        i++;
      }
    }
    return out;
  }

  const parts = normalizeParts(code);
  const fParts = finalCode ? normalizeParts(finalCode) : parts;
  const merged = parts.map((p, i) => {
    const fp = (fParts[i] !== undefined ? fParts[i] : p);
    if (!finalCode || fp === p) return p;
    const bMatch = /^(?:(0\.5C|1C))?B(\d+)$/.exec(p);
    const bMatchF = /^(?:(0\.5C|1C))?B(\d+)$/.exec(fp);
    if (bMatch && bMatchF) {
      const ty = bMatchF[1] || bMatch[1] || '';
      const initN = bMatch[2]; const finalN = bMatchF[2];
      if (initN === finalN && (bMatch[1]||'') === (bMatchF[1]||'')) return p;
      return `${ty}B${initN}[${finalN}]`;
    }
    if (p.includes('-') || fp.includes('-')) {
      if (p === fp) return p;
      return `${p}[${fp}]`;
    }
    const prefixMatch = /^([A-Za-z.]+)(\d.*)$/.exec(p);
    const fPrefixMatch = /^([A-Za-z.]+)(\d.*)$/.exec(fp);
    if (prefixMatch && fPrefixMatch && prefixMatch[1] === fPrefixMatch[1]) {
      return `${p}[${fPrefixMatch[2]}]`;
    }
    return `${p}[${fp}]`;
  });
  const gStr = gSub ? (finalGSub && finalGSub !== gSub ? `-G${gSub}[${finalGSub}]` : `-G${gSub}`) : '';
  return merged.join('-') + gStr;
}

function ConfigCodeCard({ code, finalCode, extOn, hw, kw, dem, tfLabel, subLabel, isLV, gSub, finalGSub }) {

function BE_BDCell({ cp, gridKVA, hw, bessAllowed, maxBess }) {
  const ct=BE_autoCharger(cp,hw);const pt=electraPromise(cp);
  const bess=calcBESS(cp,gridKVA,bessAllowed,maxBess);
  const bessKW=(bess.s==='bess_ok'&&bess.mod&&BESS_SPEC[bess.ty])?bess.mod*BESS_SPEC[bess.ty].kw:0;
  const kWperCP=Math.round((gridKVA+bessKW)/cp);const hasBESS=bess.s==='bess_ok'&&!!bess.mod&&!!bess.ty;
  const bg=bess.s==='impossible'?'bg-red-100':hasBESS&&bess.ty==='1C'?'bg-amber-50':hasBESS?'bg-sky-50':'bg-white';
  const border=bess.s==='impossible'?'border-red-300':hasBESS&&bess.ty==='1C'?'border-amber-200':hasBESS?'border-sky-200':'border-gray-200';
  return (
    <td className={"p-1 border text-center align-middle " + (bg) + " " + (border)} style={{minWidth:100}}>
      {bess.s==='impossible'?(
        <div className="text-red-500 font-semibold" style={{fontSize:9}}>x</div>
      ):(
        <div>
          <div className="font-bold" style={{fontSize:14}}><span style={{color:kWperCP>=pt?'#16a34a':'#ea580c'}}>{kWperCP}</span><span className="text-gray-400 font-normal" style={{fontSize:8}}> kW/spot</span></div>
          {hasBESS&&<div className={"font-bold " + (bess.ty==='1C'?'text-amber-700':'text-sky-600')} style={{fontSize:9}}>{bess.mod}x{bess.ty}</div>}
        </div>
      )}
    </td>
  );
}

function CH_BDCell({ cp, tf, hw, bOK, mx }) {
  const ct=CH_autoCT(cp,hw);const ptV=electraPromise(cp);const dem=CH_demand(cp,ptV,ct);
  if(dem>tf.kva&&!bOK)return <td className="p-2 border border-red-100 bg-red-50 text-center" style={{minWidth:100}}><span className="text-red-400 text-xs">x</span></td>;
  const gSub=CH_minSubForDem(dem,tf.kva);const b=calcBESS(cp,gSub,bOK,mx);
  if(b.s==='impossible')return <td className="p-1 border border-red-200 bg-red-100 text-center" style={{minWidth:100}}><div className="text-red-500 font-semibold" style={{fontSize:9}}>x Impossible</div></td>;
  const cx=CH_calcCX(cp,tf,gSub,ct,b);const avail=gSub+(b.s==='bess_ok'&&b.mod?b.mod*BESS_SPEC[b.ty].kw:0);
  const kw=CH_realKW(cp,avail,ct,gSub);const hasBESS=b.s==='bess_ok'&&!!b.mod;const subOpt=gSub<tf.kva;
  const bg=hasBESS&&b.ty==='1C'?'bg-amber-50':hasBESS?'bg-sky-50':subOpt?'bg-green-50':tf.isLV?'bg-teal-50':'bg-white';
  const bd=hasBESS&&b.ty==='1C'?'border-amber-200':hasBESS?'border-sky-200':subOpt?'border-green-200':tf.isLV?'border-teal-200':'border-gray-200';
  return (
    <td className={"p-1.5 border " + (bd) + " " + (bg) + " text-center align-middle"} style={{minWidth:100}}>
      <div className={"font-semibold mb-0.5 " + (subOpt?'text-green-600':tf.isLV?'text-teal-600':'text-gray-500')} style={{fontSize:9}}>Grid {gSub} kVA</div>
      <div className="text-gray-400 mb-0.5" style={{fontSize:8}}>{Math.round(cx.gCoChf/1000)}k CHF ({Math.round(cx.gCo/1000)}kEUR)</div>
      {hasBESS&&<div className={"font-bold mb-0.5 " + (b.ty==='1C'?'text-amber-600':'text-sky-600')} style={{fontSize:9}}>{b.mod}x{b.ty}</div>}
      <div className="font-bold" style={{fontSize:15}}><span style={{color:kw>=ptV?'#16a34a':'#ea580c'}}>{kw}</span><span className="text-gray-400 font-normal" style={{fontSize:8}}> kW/spot</span></div>
      <div className="font-semibold text-gray-700" style={{fontSize:10}}>{(cx.total/1000).toFixed(0)}kEUR</div>
    </td>
  );
}

      </div>
    </div>
  );
}

function ES_BDCell({ cp, tf, hw, bOK, mx }) {
  const ct=ES_autoCT(cp,hw);const ptV=electraPromise(cp);const dem=ES_demand(cp,ptV,ct);
  if(dem>tf.kva&&!bOK)return <td className="p-1 border border-red-100 bg-red-50 text-center" style={{minWidth:100}}><span className="text-red-400 text-xs">x</span></td>;
  const gSub=ES_fullSubForHW(ct,cp,tf);const b=calcBESS(cp,gSub,bOK,mx);
  if(b.s==='impossible')return <td className="p-1 border border-red-200 bg-red-100 text-center" style={{minWidth:100}}><div className="text-red-500 font-semibold" style={{fontSize:9}}>x Impossible</div></td>;
  const cx=ES_calcCX(cp,tf,gSub,ct,b);const avail=gSub+(b.s==='bess_ok'&&b.mod?b.mod*BESS_SPEC[b.ty].kw:0);
  const kw=ES_realKW(cp,avail,ct,gSub);const hasBESS=b.s==='bess_ok'&&!!b.mod;
  const bg=hasBESS&&b.ty==='1C'?'bg-amber-50':hasBESS?'bg-sky-50':tf.isLV?'bg-teal-50':'bg-white';
  const bd=hasBESS&&b.ty==='1C'?'border-amber-200':hasBESS?'border-sky-200':tf.isLV?'border-teal-200':'border-gray-200';
  return (
    <td className={"p-1.5 border " + (bd) + " " + (bg) + " text-center align-middle"} style={{minWidth:100}}>
      <div className={"font-semibold mb-0.5 " + (tf.isLV?'text-teal-600':'text-gray-500')} style={{fontSize:9}}>Grid {gSub} kVA</div>
      {hasBESS&&<div className={"font-bold mb-0.5 " + (b.ty==='1C'?'text-amber-600':'text-sky-600')} style={{fontSize:9}}>{b.mod}x{b.ty}</div>}
      <div className="font-bold" style={{fontSize:15}}><span style={{color:kw>=ptV?'#16a34a':'#ea580c'}}>{kw}</span><span className="text-gray-400 font-normal" style={{fontSize:8}}> kW/spot</span></div>
      <div className="font-semibold text-gray-700" style={{fontSize:10}}>{(cx.total/1000).toFixed(0)}kEUR</div>
    </td>
  );
}

function AT_Configurator() {
  const [hw,setHw]=useState("alpi");
  const [initCP,setInitCP]=useState(8);
  const [extOn,setExtOn]=useState(false);
  const [addedCP,setAddedCP]=useState(4);
  const [bOK,setBOK]=useState(true);
  const [mx,setMx]=useState(3);
  const [bessType,setBessType]=useState("auto");
  const [archOvAT,setArchOvAT]=useState(null);
  const [tfIdx,setTfIdx]=useState(null);
  const [gSubOv,setGSubOv]=useState(null);
  const [finalGSubOv,setFinalGSubOv]=useState(null);

  const maxCP=40;
  const clampAdd=Math.min(addedCP,Math.max(0,maxCP-initCP));
  const finalCP=extOn?initCP+clampAdd:initCP;
  const [forceMono,setForceMono]=useState(false);
  const ct=useMemo(()=>forceMono?'MONO':AT_autoCT(initCP,hw),[initCP,hw,forceMono]);
  const ptV=electraPromise(initCP);
  const dem=AT_demand(initCP,ptV,ct);
  const autoReco=useMemo(()=>AT_findReco(extOn?finalCP:initCP,ct,hw,bOK,mx),[initCP,finalCP,extOn,ct,hw,bOK,mx]);
  const selTf=useMemo(()=>tfIdx!==null?AT_TRANSFOS[tfIdx]:autoReco&&autoReco.tf?autoReco.tf:AT_TRANSFOS[1],[tfIdx,autoReco]);
  const availGSubs=useMemo(()=>AT_gridSubsForTf(selTf),[selTf]);
  const autoGSub=useMemo(()=>{const subs=AT_gridSubsForTf(selTf);return subs.find(g=>g>=dem)||subs[subs.length-1]||selTf.kva;},[selTf,dem]);
  const gSub=gSubOv!==null?gSubOv:autoGSub;
  const availFinalGSubs=useMemo(()=>availGSubs.filter(g=>g>=gSub),[availGSubs,gSub]);
  const autoFinalGSub=useMemo(()=>{
    if(!extOn)return gSub;
    const fDem=AT_demand(finalCP,electraPromise(finalCP),ct);
    const cand=availFinalGSubs.find(g=>g>=fDem)||availFinalGSubs[availFinalGSubs.length-1]||selTf.kva;
    return Math.max(cand,gSub);
  },[extOn,finalCP,ptV,ct,availFinalGSubs,gSub,selTf]);
  const finalGSub=extOn?(finalGSubOv!==null?Math.max(finalGSubOv,gSub):autoFinalGSub):gSub;
  const bessForce=bessType==="auto"?null:bessType;
  const extPlanAT=useMemo(()=>(!extOn||!autoReco)?null:planExtBESS(initCP,finalCP,gSub,finalGSub,bOK,mx,bessForce),[extOn,initCP,finalCP,gSub,finalGSub,bOK,mx,bessForce]);
  const bess=useMemo(()=>{const b=extOn&&extPlanAT?extPlanAT.initBess:calcBESS(initCP,gSub||selTf.kva,bOK,mx,bessForce,ct);return b&&b.s?b:{s:'no_bess'};},[initCP,gSub,selTf,bOK,mx,bessForce,extOn,extPlanAT,ct]);
  const extBess=extOn&&extPlanAT?extPlanAT.finalBess:null;
  const cx=useMemo(()=>AT_calcCX(initCP,selTf,gSub,ct,bess),[initCP,selTf,gSub,ct,bess]);
  const avail=gSub+(bess.s==="bess_ok"&&bess.mod?bess.mod*BESS_SPEC[bess.ty].kw:0);
  const kw=AT_realKW(initCP,avail,ct,gSub);
  const initPU=AT_puCount(ct,initCP);
  const initMod=bess.s==="bess_ok"&&bess.mod?bess.mod:0;
  const addedMod=extBess&&extBess.s==="bess_ok"&&extBess.mod?Math.max(0,extBess.mod-initMod):0;
  const finalPU=AT_puCount(ct,finalCP);
  const addedPU=Math.max(0,finalPU-initPU);
  const extDelta=useMemo(()=>{
    if(!extOn||!extBess||extBess.s==="impossible")return null;
    const puC=AT_extPUCost(ct,initCP,finalCP,gSub,finalGSub);
    const bSpec=BESS_SPEC[extBess.ty||'0.5C'];
    const bC=addedMod*(bSpec.hw+bSpec.inst);
    let instE;
    if(ct==="MONO"||ct==="MONO")instE=Math.max(0,Math.ceil(finalCP/2)-Math.ceil(initCP/2))*AT_INST.varDC;
    else if(ct==="HPU")instE=addedPU*AT_INST.puFix+(Math.ceil(finalCP/2)-Math.ceil(initCP/2))*AT_INST.dispVar;
    else instE=Math.max(0,alpiCfgBE(finalCP).units-alpiCfgBE(initCP).units)*AT_INST.puFix+(Math.ceil(finalCP/2)-Math.ceil(initCP/2))*AT_INST.dispVar;
    const gridC=Math.max(0,AT_gridCoCost(finalGSub)-AT_gridCoCost(gSub));
    return{puC,bC,instE,gridC,total:puC+bC+instE+gridC};
  },[extOn,extBess,ct,initCP,finalCP,clampAdd,addedMod,addedPU,finalGSub,gSub]);
  const code=AT_buildCode(initCP,ct,bess,selTf,gSub);
  const finalCode=extOn&&extBess&&extBess.s!=="impossible"?AT_buildCode(finalCP,ct,extBess,selTf,finalGSub):null;
  const gridSaving=selTf.kva>gSub?(selTf.kva-gSub)*AT_GRID_VAR:0;
  const _atAlpiM=alpiCfgBE(initCP).model;
  const archDesc=ct==="MONO"?"Monolithic - HYC400":ct==="MONO"?"Monolithic - HYC400":ct==="HPU"?"Distributed - Huawei HPU":"Distributed - Alpitronic "+alpiLabel(initCP,gSub);
  const bessBg=bess.s==="impossible"?"border-red-200 bg-red-50":bess.s==="no_bess"?"border-green-200 bg-green-50":"border-orange-200 bg-orange-50";

  const stdFootnote = useMemo(() => {
    if (!autoReco) return null;
    return getStdConfigFootnote('AT', finalCP, 'alpi', {
      tf: autoReco.tf || (autoReco.transfoKVA ? {kva:autoReco.transfoKVA,isLV:autoReco.transfoKVA<300} : null),
      gSub: autoReco.gSub,
      bess: autoReco.bess,
      alpiModel: 'alpi' === 'alpi' ? alpiModel(finalCP) : null,
    });
  }, [autoReco, finalCP]);
  return (
    <div className="p-4 max-w-5xl mx-auto">
      <h2 className="text-lg font-bold text-gray-900 mb-1">Station Configurator - Austria</h2>
      {extOn&&extBess&&extBess.s==="impossible"&&<div className="mb-4 rounded-xl p-4 border-2 bg-red-50 border-red-500"><div className="font-bold text-red-700">Extension not possible</div><div className="text-red-600 text-sm mt-1">{extBess.reason}</div></div>}
      <div className="grid gap-5" style={{gridTemplateColumns:"1fr 1fr"}}>
        <div className="space-y-4">
          <div>
            <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Hardware</label>
            <div className="flex gap-2">
              {[["alpi","Alpitronic APU","bg-purple-700"]].map(([sv,label,activeBg])=>(
                <button key={sv} onClick={()=>{setHw(sv);setTfIdx(null);setGSubOv(null);setArchOvAT(null);}}
                  className={"flex-1 py-2 rounded-lg text-sm font-semibold "+(hw===sv?activeBg+" text-white":"bg-gray-100 text-gray-600")}>
                  {label}
                </button>
              ))}
            </div>
          </div>
          <div>
            <button onClick={()=>setForceMono(v=>!v)} className={"px-3 py-1.5 rounded-lg text-xs font-semibold border "+(forceMono?"bg-slate-800 text-white border-slate-800":"bg-white text-slate-600 border-slate-300")}>{forceMono?"HYC400 forced (all sizes)":"Force HYC400"}</button>
            <span className="ml-2 text-xs text-gray-400">Small monolithic charger - allowed at any station size</span>
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Initial spots: <span className="text-blue-600 font-bold text-sm">{initCP}</span></label>
            <input type="range" min={2} max={40} step={2} value={initCP} onChange={e=>{setInitCP(Number(e.target.value));setTfIdx(null);setGSubOv(null);}} className="w-full accent-blue-600"/>
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Extension</label>
            <div className="flex gap-2 mb-2">
              <button onClick={()=>setExtOn(false)} className={"px-3 py-1.5 rounded text-sm font-medium "+(!extOn?"bg-gray-900 text-white":"bg-gray-100 text-gray-600")}>None</button>
              <button onClick={()=>setExtOn(true)} className={"px-3 py-1.5 rounded text-sm font-medium "+(extOn?"bg-purple-600 text-white":"bg-gray-100 text-gray-600")}>+ Extension</button>
            </div>
            {extOn&&<div className="bg-purple-50 border border-purple-200 rounded-lg p-3 space-y-2">
              <div className="flex items-center gap-2">
                <span className="text-xs font-semibold text-purple-700 shrink-0 w-20">Added spots:</span>
                <input type="range" min={2} max={Math.max(0,40-initCP)} step={2} value={clampAdd} onChange={e=>setAddedCP(parseInt(e.target.value))} className="flex-1 accent-purple-600"/>
                <span className="text-sm font-bold text-purple-700 shrink-0 w-14 text-right">+{clampAdd} spots</span>
              </div>
              <div className="text-xs text-purple-600">Initial: <strong>{initCP} spots</strong> - Final: <strong>{finalCP} spots</strong></div>
            </div>}
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
              Electrical distribution <span className={"ml-1 text-xs px-2 py-0.5 rounded font-semibold "+(selTf.isLV?"bg-sky-100 text-sky-700":"bg-orange-100 text-orange-700")}>{selTf.isLV?"LV":"MV"} {selTf.label} kVA</span>

function BE_Configurator() {

  const [bessAllowed,setBessAllowed]=useState(true);const [maxBess,setMaxBess]=useState(3);
  const [bessType,setBessType]=useState("auto");
  const [archOverride,setArchOverride]=useState(null);
  const [tfIdx,setTfIdx]=useState(null);const [gridOverride,setGridOverride]=useState(null);const [gridText,setGridText]=useState("");const [finalGridOverride,setFinalGridOverride]=useState(null);
  const clampedAdd=Math.min(addedCP,Math.max(0,40-initCP));const finalCP=extOn?initCP+clampedAdd:initCP;const designCP=extOn?finalCP:initCP;
  const [forceMono,setForceMono]=useState(false);
  const ct=useMemo(()=>forceMono?'MONO':BE_autoCharger(initCP,hw),[initCP,hw,forceMono]);
  const pt=electraPromise(initCP);const demand=initCP*pt;const dem=demand;const ptV=pt;
  const autoReco=useMemo(()=>BE_findOptimalGridFirst(extOn?finalCP:initCP,initCP,bessAllowed,ct,maxBess),[extOn,initCP,finalCP,bessAllowed,ct,maxBess]);
  const selTf=useMemo(()=>tfIdx!==null?BE_TRANSFOS[tfIdx]:BE_TRANSFOS.find(t=>t.kva===(autoReco&&autoReco.transfoKVA||1000))||BE_TRANSFOS[0],[tfIdx,autoReco]);
  const availGridSubs=useMemo(()=>BE_gridSubsForTf(selTf.kva),[selTf]);
  const autoGridKVA=useMemo(()=>{
    const r=BE_findOptimalGridFirst(initCP,initCP,bessAllowed,ct,maxBess,selTf);
    return r.gridKVA>0?r.gridKVA:availGridSubs[availGridSubs.length-1]||selTf.kva;
  },[selTf,initCP,bessAllowed,ct,maxBess,availGridSubs]);
  const gridKVA=gridOverride!==null?gridOverride:autoGridKVA;
  const gSub=gridKVA;
  const availFinalGridSubs=useMemo(()=>availGridSubs.filter(g=>g>=gridKVA),[availGridSubs,gridKVA]);
  const autoFinalGridKVA=useMemo(()=>{
    if(!extOn)return gridKVA;
    const r=BE_findOptimalGridFirst(finalCP,initCP,bessAllowed,ct,maxBess,selTf);
    const cand=r.gridKVA>0?r.gridKVA:availFinalGridSubs[availFinalGridSubs.length-1]||selTf.kva;
    return Math.max(cand,gridKVA);
  },[extOn,finalCP,initCP,bessAllowed,ct,maxBess,selTf,availFinalGridSubs,gridKVA]);
  const finalGridKVA=extOn?(finalGridOverride!==null?Math.max(finalGridOverride,gridKVA):autoFinalGridKVA):gridKVA;
  const finalGSub=finalGridKVA;
  const kw=Math.floor(Math.min(gridKVA, (()=>{const c=BE_autoCharger(initCP,hw);return c==='HPU'?Math.ceil(initCP/8)*720:c==='MONO'?Math.ceil(initCP/2)*400:alpiCfgBE(initCP).total;})())/initCP);
  const beForcedType=bessType==="auto"?null:bessType;
  const extPlan=useMemo(()=>(!extOn||!autoReco)?null:BE_planExtBESS(initCP,finalCP,gridKVA,finalGridKVA,bessAllowed,maxBess,beForcedType),[extOn,initCP,finalCP,gridKVA,finalGridKVA,bessAllowed,maxBess,beForcedType]);
  const extBess=extOn&&extPlan?extPlan.finalBess:null;
  const bess=useMemo(()=>extOn&&extPlan?extPlan.initBess:calcBESS(initCP,gridKVA,bessAllowed,maxBess,beForcedType),[extOn,extPlan,initCP,gridKVA,bessAllowed,maxBess,beForcedType]);
  const capex=useMemo(()=>BE_calcCAPEX(initCP,selTf.kva,gridKVA,ct,bess),[initCP,selTf,gridKVA,ct,bess]);

              <div className="space-y-1 text-sm">
                {archRows([["Phase 1",initMod+"x "+bess.ty],(extOn&&addedMod>0&&extBess&&extBess.ty?["+ Phase 2","+"+addedMod+"x "+extBess.ty]:null),["Recharge",(bess.rH||0).toFixed(1)+"h (max 12h)"],["OPEX gain/yr",(initMod*BE_OPEX_GAIN[bess.ty]).toLocaleString()+" EUR"]]).map(([k,v])=><div key={k} className="flex justify-between"><span className="text-gray-500">{k}</span><span className={"font-semibold text-xs "+(bess.ty==="1C"?"text-amber-700":"text-blue-700")}>{v}</span></div>)}

                  <div className="flex justify-between font-semibold border-t border-purple-100 pt-1 mt-1"><span className="text-purple-700">Extension CAPEX</span><span className="text-purple-700">{(extDelta.total/1000).toFixed(0)}k EUR</span></div>
                </div>

// SWITZERLAND CONFIGURATOR

function CH_Configurator() {
  const [hw,setHw]=useState("huawei");const [initCP,setInitCP]=useState(8);
  const [extOn,setExtOn]=useState(false);const [addedCP,setAddedCP]=useState(4);
  const [bOK,setBOK]=useState(true);const [mx,setMx]=useState(3);const [bessType,setBessType]=useState("auto");
  const [tfIdx,setTfIdx]=useState(null);const [gSubOv,setGSubOv]=useState(null);const [finalGSubOv,setFinalGSubOv]=useState(null);
  const clampAdd=Math.min(addedCP,Math.max(0,40-initCP));const finalCP=extOn?initCP+clampAdd:initCP;
  const [forceMono,setForceMono]=useState(false);
  const ct=useMemo(()=>forceMono?'MONO':CH_autoCT(initCP,hw),[initCP,hw,forceMono]);
  const ptV=electraPromise(initCP);const dem=CH_demand(initCP,ptV,ct);
  const autoReco=useMemo(()=>CH_findReco(extOn?finalCP:initCP,ct,hw,bOK,mx),[initCP,finalCP,extOn,ct,hw,bOK,mx]);
  const selTf=useMemo(()=>tfIdx!==null?CH_TRANSFOS[tfIdx]:autoReco&&autoReco.tf?autoReco.tf:CH_TRANSFOS[1],[tfIdx,autoReco]); // index1 = 1000 kVA (post-restriction default)
  const availGSubs=useMemo(()=>CH_gridSubsForTf(selTf),[selTf]);
  const autoGSub=useMemo(()=>selTf.isLV?CH_LV_TARGET:CH_minSubForDem(dem,selTf.kva),[dem,selTf]);
  const gSub=gSubOv!==null?gSubOv:autoGSub;
  const availFinalGSubs=useMemo(()=>availGSubs.filter(g=>g>=gSub),[availGSubs,gSub]);
  const autoFinalGSub=useMemo(()=>{
    if(!extOn)return gSub;
    const fDem=CH_demand(finalCP,electraPromise(finalCP),ct);
    const cand=selTf.isLV?CH_lvTierFor(fDem):CH_minSubForDem(fDem,selTf.kva);
    return Math.max(cand,gSub);
  },[extOn,finalCP,ct,selTf,gSub]);
  const finalGSub=extOn?(finalGSubOv!==null?Math.max(finalGSubOv,gSub):autoFinalGSub):gSub;
  const bessForce=bessType==="auto"?null:bessType;
  const extPlanCH=useMemo(()=>(!extOn||!autoReco)?null:planExtBESS(initCP,finalCP,gSub,finalGSub,bOK,mx,bessForce),[extOn,initCP,finalCP,gSub,finalGSub,bOK,mx,bessForce]);
  const bess=useMemo(()=>{const b=extOn&&extPlanCH?extPlanCH.initBess:calcBESS(initCP,gSub||selTf.kva,bOK,mx,bessForce);return b&&b.s?b:{s:'no_bess'};},[initCP,gSub,selTf,bOK,mx,bessForce,extOn,extPlanCH]);
  const extBess=extOn&&extPlanCH?extPlanCH.finalBess:null;
  const cx=useMemo(()=>CH_calcCX(initCP,selTf,gSub,ct,bess),[initCP,selTf,gSub,ct,bess]);
  const avail=gSub+(bess.s==="bess_ok"&&bess.mod?bess.mod*BESS_SPEC[bess.ty].kw:0);
  const kw=CH_realKW(initCP,avail,ct,gSub);
  const initPU=CH_puCount(ct,initCP);const initMod=bess.s==="bess_ok"&&bess.mod?bess.mod:0;
  const addedMod=extBess&&extBess.s==="bess_ok"&&extBess.mod?Math.max(0,extBess.mod-initMod):0;
  const finalPU=CH_puCount(ct,finalCP);const addedPU=Math.max(0,finalPU-initPU);
  const extDelta=useMemo(()=>{
    if(!extOn||!extBess||extBess.s==="impossible")return null;
    const puC=CH_extPUCost(ct,initCP,finalCP,gSub,finalGSub);const bSpec=BESS_SPEC[extBess.ty||'0.5C'];const bC=addedMod*(bSpec.hw+bSpec.inst);
    let instE;
    if(ct==="MONO"||ct==="MONO")instE=Math.max(0,Math.ceil(finalCP/2)-Math.ceil(initCP/2))*CH_INST.varDC;
    else if(ct==="HPU")instE=addedPU*CH_INST.puFix+(Math.ceil(finalCP/2)-Math.ceil(initCP/2))*CH_INST.dispVar;
    else instE=Math.max(0,alpiCfgBE(finalCP).units-alpiCfgBE(initCP).units)*CH_INST.puFix+(Math.ceil(finalCP/2)-Math.ceil(initCP/2))*CH_INST.dispVar;
    const gridC=Math.max(0,CH_gridCoEur(finalGSub)-CH_gridCoEur(gSub));
    return{puC,bC,instE,gridC,total:puC+bC+instE+gridC};
  },[extOn,extBess,ct,initCP,finalCP,clampAdd,addedMod,addedPU,finalGSub,gSub]);
  const code=CH_buildCode(initCP,ct,bess,selTf,gSub);
  const finalCode=extOn&&extBess&&extBess.s!=="impossible"?CH_buildCode(finalCP,ct,extBess,selTf,finalGSub):null;
  const archDesc=ct==="MONO"?"Monolithic - HYC400":ct==="MONO"?"Monolithic - HYC400":ct==="HPU"?"Distributed - Huawei HPU":"Distributed - Alpitronic "+alpiLabel(initCP,gSub);
  const bessBg=bess.s==="impossible"?"border-red-200 bg-red-50":bess.s==="no_bess"?"border-green-200 bg-green-50":"border-orange-200 bg-orange-50";
  const stdFootnote=useMemo(()=>{
    if(!autoReco)return null;
    return getStdConfigFootnote('CH',finalCP,hw,{
      tf:autoReco.tf,gSub:autoReco.gSub,bess:autoReco.bess,

    });

  return (

      {extOn&&extBess&&extBess.s==="impossible"&&<div className="mb-4 rounded-xl p-4 border-2 bg-red-50 border-red-500"><div className="font-bold text-red-700">Extension not possible</div><div className="text-red-600 text-sm mt-1">{extBess.reason}</div></div>}

                <button key={sv} onClick={()=>{setHw(sv);setTfIdx(null);setGSubOv(null);}}
                  className={"flex-1 py-2 rounded-lg text-sm font-semibold "+(hw===sv?activeBg+" text-white":"bg-gray-100 text-gray-600")}>
                  {label}
                </button>

            </div>
          </div>
          <div>
            <button onClick={()=>setForceMono(v=>!v)} className={"px-3 py-1.5 rounded-lg text-xs font-semibold border "+(forceMono?"bg-slate-800 text-white border-slate-800":"bg-white text-slate-600 border-slate-300")}>{forceMono?"HYC400 forced (all sizes)":"Force HYC400"}</button>

          </div>
          <div>

            <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Extension</label>
            <div className="flex gap-2 mb-2">
              <button onClick={()=>setExtOn(false)} className={"px-3 py-1.5 rounded text-sm font-medium "+(!extOn?"bg-gray-900 text-white":"bg-gray-100 text-gray-600")}>None</button>
              <button onClick={()=>setExtOn(true)} className={"px-3 py-1.5 rounded text-sm font-medium "+(extOn?"bg-purple-600 text-white":"bg-gray-100 text-gray-600")}>+ Extension</button>

            {extOn&&<div className="bg-purple-50 border border-purple-200 rounded-lg p-3 space-y-2">

                <input type="range" min={2} max={Math.max(0,40-initCP)} step={2} value={clampAdd} onChange={e=>setAddedCP(parseInt(e.target.value))} className="flex-1 accent-purple-600"/>

function ES_Configurator() {
  const [hw,setHw]=useState("huawei");const [initCP,setInitCP]=useState(8);
  const [extOn,setExtOn]=useState(false);const [addedCP,setAddedCP]=useState(4);
  const [bOK,setBOK]=useState(true);const [mx,setMx]=useState(3);const [bessType,setBessType]=useState("auto");
  const [tfIdx,setTfIdx]=useState(null);const [gSubOv,setGSubOv]=useState(null);const [finalGSubOv,setFinalGSubOv]=useState(null);
  const clampAdd=Math.min(addedCP,Math.max(0,40-initCP));const finalCP=extOn?initCP+clampAdd:initCP;
  const [forceMono,setForceMono]=useState(false);
  const ct=useMemo(()=>forceMono?'MONO':ES_autoCT(initCP,hw),[initCP,hw,forceMono]);
  const ptV=electraPromise(initCP);const dem=ES_demand(initCP,ptV,ct);
  const autoReco=useMemo(()=>ES_findReco(extOn?finalCP:initCP,ct,hw,bOK,mx),[initCP,finalCP,extOn,ct,hw,bOK,mx]);
  const selTf=useMemo(()=>tfIdx!==null?ES_TRANSFOS[tfIdx]:autoReco&&autoReco.tf?autoReco.tf:ES_TRANSFOS[1],[tfIdx,autoReco]); // index1 = 1000 kVA (post-restriction default)
  const availGSubs=useMemo(()=>ES_gridSubsForTf(selTf),[selTf]);
  const autoGSub=useMemo(()=>ES_fullSubForHW(ct,initCP,selTf),[ct,initCP,selTf]);
  const gSub=selTf.isLV?selTf.kva:(gSubOv!==null?gSubOv:autoGSub);
  const availFinalGSubs=useMemo(()=>selTf.isLV?[selTf.kva]:availGSubs.filter(g=>g>=gSub),[selTf,availGSubs,gSub]);
  const autoFinalGSub=useMemo(()=>{
    if(selTf.isLV)return selTf.kva;
    if(!extOn)return gSub;
    const cand=ES_fullSubForHW(ct,finalCP,selTf);
    return Math.max(cand,gSub);
  },[selTf,extOn,ct,finalCP,gSub]);
  const finalGSub=extOn?(selTf.isLV?selTf.kva:(finalGSubOv!==null?Math.max(finalGSubOv,gSub):autoFinalGSub)):gSub;
  const bessForce=bessType==="auto"?null:bessType;
  const extPlanES=useMemo(()=>(!extOn||!autoReco)?null:planExtBESS(initCP,finalCP,gSub,finalGSub,bOK,mx,bessForce),[extOn,initCP,finalCP,gSub,finalGSub,bOK,mx,bessForce]);
  const bess=useMemo(()=>{const b=extOn&&extPlanES?extPlanES.initBess:calcBESS(initCP,gSub||selTf.kva,bOK,mx,bessForce,ct);return b&&b.s?b:{s:'no_bess'};},[initCP,gSub,selTf,bOK,mx,bessForce,extOn,extPlanES,ct]);
  const extBess=extOn&&extPlanES?extPlanES.finalBess:null;
  const cx=useMemo(()=>ES_calcCX(initCP,selTf,gSub,ct,bess),[initCP,selTf,gSub,ct,bess]);
  const avail=gSub+(bess.s==="bess_ok"&&bess.mod?bess.mod*BESS_SPEC[bess.ty].kw:0);
  const kw=ES_realKW(initCP,avail,ct,gSub);
  const annualSub=ES_annualSub(gSub,selTf.isLV||false);
  const initPU=ES_puCount(ct,initCP);const initMod=bess.s==="bess_ok"&&bess.mod?bess.mod:0;
  const addedMod=extBess&&extBess.s==="bess_ok"&&extBess.mod?Math.max(0,extBess.mod-initMod):0;
  const finalPU=ES_puCount(ct,finalCP);const addedPU=Math.max(0,finalPU-initPU);

    if(!extOn||!extBess||extBess.s==="impossible")return null;
    const puC=ES_extPUCost(ct,initCP,finalCP,gSub,finalGSub);const bSpec=BESS_SPEC[extBess.ty||'0.5C'];const bC=addedMod*(bSpec.hw+bSpec.inst);
    let instE;
    if(ct==="MONO"||ct==="MONO")instE=Math.max(0,Math.ceil(finalCP/2)-Math.ceil(initCP/2))*ES_INST.varDC;
    else if(ct==="HPU")instE=addedPU*ES_INST.puFix+(Math.ceil(finalCP/2)-Math.ceil(initCP/2))*ES_INST.dispVar;
    else instE=Math.max(0,alpiCfgBE(finalCP).units-alpiCfgBE(initCP).units)*ES_INST.puFix+(Math.ceil(finalCP/2)-Math.ceil(initCP/2))*ES_INST.dispVar;
    const gridC=Math.max(0,ES_gridCoCost(finalGSub)-ES_gridCoCost(gSub));
    return{puC,bC,instE,gridC,total:puC+bC+instE+gridC};
  },[extOn,extBess,ct,initCP,finalCP,clampAdd,addedMod,addedPU,finalGSub,gSub]);

const IT_TRANSFOS = [

  { kva:2500, elecDist:172000, label:'2 500' }, // estimated - flat with 1600/2000 elecDist band, not sourced from BP
  { kva:3000, elecDist:172000, label:'3 000' }, // estimated - flat with 1600/2500 elecDist band, not sourced from BP
];
const IT_STD_TRANSFOS = IT_TRANSFOS;
const IT_MV_GRIDS = [400,450,480,495,500,525,540,600,630,700,750,800,900,1000,1250,1500,1600,1750,2000,2500,3000]; // full IT list (=DE), Master BP v33.1
const IT_GRID_CO = [ // Italy grid connection cost, Master BP v33.1 "Country Inputs" tab (col K)
  {kva:400,cost:25576},{kva:450,cost:28661},{kva:480,cost:30511},{kva:495,cost:31437},
  {kva:500,cost:31745},{kva:525,cost:33287},{kva:540,cost:34213},{kva:600,cost:37914},
  {kva:630,cost:39765},{kva:700,cost:44083},{kva:750,cost:47168},{kva:800,cost:50252},
  {kva:900,cost:56421},{kva:1000,cost:62590},{kva:1250,cost:78013},{kva:1500,cost:93435},
  {kva:1600,cost:99604},{kva:1750,cost:124280},{kva:2000,cost:124280},{kva:2500,cost:155125},
  {kva:3000,cost:185970},
];
const IT_gridCoCost=(kva)=>{for(const r of IT_GRID_CO){if(r.kva>=kva)return r.cost;}return IT_GRID_CO[IT_GRID_CO.length-1].cost;};
function IT_gridSubsForTf(tf){if(tf.isLV)return[tf.kva];return IT_MV_GRIDS.filter(g=>g<=tf.kva);}
const IT_ENG_HV=18000;const IT_ENG_LV=9000;const IT_LV_PANEL_OPT=-3000;
const IT_INST={fix:110000,fixLV:22000,puFix:11000,varDC:20000,dispVar:20000};
const IT_NET_OPEX={'1C':6800,'0.5C':4300};

function IT_autoCT(cp,hw){if(cp<=4)return 'MONO';return hw==='alpi'?'APU':'HPU';}
function IT_hwCap(ct,cp,gKVA){
  if(ct==='MONO')return Math.ceil(cp/2)*400;
  if(ct==='HPU')return Math.ceil(cp/8)*HPU_MAX;
  return alpiCfgBE(cp,gKVA||0).total;
}
function IT_demand(cp,ptV,ct){return Math.min(cp*ptV,IT_hwCap(ct,cp));}
function IT_realKW(cp,avail,ct,gKVA){return Math.round(Math.min(avail,IT_hwCap(ct,cp,gKVA||0))/cp);}
function IT_puCount(ct,cp){if(ct==='MONO')return Math.ceil(cp/2);if(ct==='HPU')return Math.ceil(cp/8);return alpiCfgBE(cp).units;}
function IT_chHW(ct,cp,gKVA){
  if(ct==='MONO'){const u=Math.ceil(cp/2);return{hw:u*(u===1?HYC400_FULL:HYC400_STACKED),u,label:`${u}x HYC400`};}
  if(ct==='HPU'){const u=Math.ceil(cp/8);return{hw:u*HPU_UNIT+Math.ceil(cp/2)*DISP_HUA,u,label:`${u}x HPU + ${Math.ceil(cp/2)} disp`};}
  const c=alpiCfgBE(cp,gKVA||0);const hw_cost=c.n1000*APU_1000+c.n750*APU_750+Math.ceil(cp/2)*DISP_ALPI;
  const lbl=c.model==='mixed'?(c.n1000)+"x HYC1000 + "+(c.n750)+"x HYC750 + "+Math.ceil(cp/2)+" disp":(c.units)+"x "+(c.model==="HYC1000"?"HYC1000":"HYC750")+" + "+Math.ceil(cp/2)+" disp";
  return{hw:hw_cost,u:c.units,label:lbl};
}
function IT_extPUCost(ct,iCP,fCP,iGrid,fGrid){
  const added=fCP-iCP;
  if(ct==='MONO')return Math.max(0,Math.ceil(fCP/2)-Math.ceil(iCP/2))*HYC400_STACKED;
  if(ct==='HPU')return Math.max(0,Math.ceil(fCP/8)-Math.ceil(iCP/8))*HPU_UNIT+(Math.ceil(fCP/2)-Math.ceil(iCP/2))*DISP_HUA;
  const ci=alpiCfgBE(iCP,iGrid||0),cf=alpiCfgBE(fCP,fGrid||0);
  const a1000=Math.max(0,cf.n1000-ci.n1000),a750=Math.max(0,cf.n750-ci.n750);
  const upg=(ci.units===cf.units&&ci.n1000<cf.n1000)?Math.min(ci.n750,cf.n1000-ci.n1000)*(APU_1000-APU_750):0;
  return a1000*APU_1000+a750*APU_750+upg+(Math.ceil(fCP/2)-Math.ceil(iCP/2))*DISP_ALPI;
}
function IT_calcCX(cp,tf,gSub,ct,b){
  const isDist=ct!=='MONO';
  const eng=tf.isLV?IT_ENG_LV:IT_ENG_HV;const gCo=IT_gridCoCost(gSub);const eDist=tf.elecDist+(isDist?IT_LV_PANEL_OPT:0);const ch=IT_chHW(ct,cp,gSub);
  const instF=tf.isLV?IT_INST.fixLV:IT_INST.fix;
  let iV;
  if(ct==='MONO')iV=Math.ceil(cp/2)*IT_INST.varDC;
  else if(ct==='HPU')iV=Math.ceil(cp/8)*IT_INST.puFix+Math.ceil(cp/2)*IT_INST.dispVar;
  else iV=alpiCfgBE(cp).units*IT_INST.puFix+Math.ceil(cp/2)*IT_INST.dispVar;
  const bC=b.s==='bess_ok'&&b.mod?b.mod*(BESS_SPEC[b.ty].hw+BESS_SPEC[b.ty].inst):0;
  const total=eng+gCo+eDist+ch.hw+ELECTRA_BOX+instF+iV+bC;
  return{eng,gCo,eDist,chHW:ch.hw,other:ELECTRA_BOX,instFix:instF,instVar:iV,bess:bC,total,chLabel:ch.label};
}
function IT_findBest(cp,ct,hw,bOK,mx,mode){
  const ptV=electraPromise(cp);const need=ptV*cp;
  const itStdTf=stdTransfoForCP('IT',cp,IT_TRANSFOS);
  let bestNoBess=null;
  const tryNoBess=(list)=>{
    for(const tf of list){
      const gSub=targetGrid(tf,ct,cp,IT_gridSubsForTf(tf));
      if(gSub<need)continue;
      const cx=IT_calcCX(cp,tf,gSub,ct,{s:'no_bess'});
      const n10=cx.total;const score=mode==='reco'?cx.total:n10;
      if(!bestNoBess||score<(mode==='reco'?bestNoBess.capex:bestNoBess.net10))bestNoBess={tf,gSub,bess:{s:'no_bess'},capex:cx.total,net10:n10};
    }
  };
  tryNoBess(itStdTf);
  if(!bestNoBess)tryNoBess(IT_TRANSFOS);
  let bestBess=null;
  if(bOK){
    const tryBess=(list)=>{
      for(const tf of list){for(const gSub of IT_gridSubsForTf(tf)){
        const b=calcBESS(cp,gSub,true,mx,null,ct);if(b.s==='impossible')continue;
        const cx=IT_calcCX(cp,tf,gSub,ct,b);
        const netB=b.s==='bess_ok'&&b.mod?IT_NET_OPEX[b.ty]*b.mod:0;const n10=cx.total-netB*10;
        const score=mode==='reco'?cx.total:n10;
        if(!bestBess||score<(mode==='reco'?bestBess.capex:bestBess.net10))bestBess={tf,gSub,bess:b,capex:cx.total,net10:n10};
      }}
    };
    tryBess(itStdTf);
    if(!bestBess)tryBess(IT_TRANSFOS);
  }
  if(!bestNoBess)return bestBess;
  if(!bestBess)return bestNoBess;
  const scoreOf=(x)=>mode==='reco'?x.capex:x.net10;
  return scoreOf(bestBess)<scoreOf(bestNoBess)?bestBess:bestNoBess;
}
const IT_findReco=(cp,ct,hw,bOK,mx)=>IT_findBest(cp,ct,hw,bOK,mx,'reco');
const IT_find10yr=(cp,ct,hw,bOK,mx)=>IT_findBest(cp,ct,hw,bOK,mx,'10yr');
function IT_buildCode(cp,ct,b,tf,gSub){
  const arch=ct==='MONO'?'PU0':ct==='HPU'?`HPU${Math.ceil(cp/8)}`:alpiArchStr(cp,gSub);
  const bStr=b.s==='bess_ok'&&b.mod?`${b.ty}B${b.mod}`:'B0';
  return `IT-S${cp}-${arch}-${bStr}-T${tf.kva}`;
}

function MVConfigurator({ C }) {
  const [hw,setHw]=useState("huawei");const [initCP,setInitCP]=useState(8);
  const [extOn,setExtOn]=useState(false);const [addedCP,setAddedCP]=useState(4);
  const [bOK,setBOK]=useState(true);const [mx,setMx]=useState(3);const [bessType,setBessType]=useState("auto");
  const [tfIdx,setTfIdx]=useState(null);const [gSubOv,setGSubOv]=useState(null);const [finalGSubOv,setFinalGSubOv]=useState(null);
  const clampAdd=Math.min(addedCP,Math.max(0,40-initCP));const finalCP=extOn?initCP+clampAdd:initCP;
  const [forceMono,setForceMono]=useState(false);
  const ct=useMemo(()=>forceMono?'MONO':C.autoCT(initCP,hw),[initCP,hw,forceMono]);
  const ptV=electraPromise(initCP);const dem=C.demand(initCP,ptV,ct);
  const autoReco=useMemo(()=>C.findReco(extOn?finalCP:initCP,ct,hw,bOK,mx),[initCP,finalCP,extOn,ct,hw,bOK,mx]);

  const bess=useMemo(()=>{const b=extOn&&extPlan?extPlan.initBess:calcBESS(initCP,gSub||selTf.kva,bOK,mx,bessForce,ct);return b&&b.s?b:{s:'no_bess'};},[initCP,gSub,selTf,bOK,mx,bessForce,extOn,extPlan,ct]);

    const gridC=Math.max(0,C.gridCoCost(finalGSub)-C.gridCoCost(gSub));
    return{puC,bC,instE,gridC,total:puC+bC+instE+gridC};
  },[extOn,extBess,ct,initCP,finalCP,clampAdd,addedMod,addedPU,finalGSub,gSub]);
  const code=C.buildCode(initCP,ct,bess,selTf,gSub);
  const finalCode=extOn&&extBess&&extBess.s!=="impossible"?C.buildCode(finalCP,ct,extBess,selTf,finalGSub):null;
  const archDesc=ct==="MONO"?"Monolithic - HYC400":ct==="HPU"?"Distributed - Huawei HPU":"Distributed - Alpitronic "+alpiLabel(initCP,gSub);

  },[autoReco,finalCP]);
  return (

        </div>
      </div>
      {stdFootnote && (<div style={{background:'#fefce8',border:'1px solid #fde68a',borderRadius:6,padding:'8px 12px',marginTop:8,fontSize:11,color:'#92400e',lineHeight:1.5}}>{stdFootnote}</div>)}

const IT_CFG={name:'Italy',code:'IT',TRANSFOS:IT_TRANSFOS,autoCT:IT_autoCT,demand:IT_demand,realKW:IT_realKW,puCount:IT_puCount,chHW:IT_chHW,extPUCost:IT_extPUCost,calcCX:IT_calcCX,findReco:IT_findReco,buildCode:IT_buildCode,gridSubsForTf:IT_gridSubsForTf,gridCoCost:IT_gridCoCost,INST:IT_INST,NET_OPEX:IT_NET_OPEX};

const FR_TRANSFOS = [
  { kva:250,  elecDist:18000,  label:'250', isLV:true }, // LV threshold = Tarif Jaune ceiling (36-250 kVA BT) - elecDist estimated, not sourced from BP
  { kva:1000, elecDist:120000, label:'1 000' },
  { kva:1600, elecDist:165000, label:'1 600' },
  { kva:2000, elecDist:165000, label:'2 000' },
  { kva:2500, elecDist:165000, label:'2 500' }, // estimated - flat with 1600/2000 elecDist band, not sourced from BP
  { kva:3000, elecDist:165000, label:'3 000' }, // estimated - flat with 1600/2500 elecDist band, not sourced from BP
];
const FR_STD_TRANSFOS = FR_TRANSFOS;
const FR_MV_GRIDS = [250,500,750,1000,1600,2000,2500,3000]; // full FR list, Master BP v33.1
const FR_GRID_CO = [ // France grid connection cost, Master BP v33.1 "Country Inputs" tab (col I)
  {kva:250,cost:15000},{kva:500,cost:35000},{kva:750,cost:35000},{kva:1000,cost:35000},
  {kva:1600,cost:45000},{kva:2000,cost:55000},{kva:2500,cost:65000},{kva:3000,cost:70000},
];
const FR_gridCoCost=(kva)=>{for(const r of FR_GRID_CO){if(r.kva>=kva)return r.cost;}return FR_GRID_CO[FR_GRID_CO.length-1].cost;};
function FR_gridSubsForTf(tf){if(tf.isLV)return[tf.kva];return FR_MV_GRIDS.filter(g=>g<=tf.kva);}
const FR_ENG_HV=16000;const FR_ENG_LV=8000;const FR_LV_PANEL_OPT=-3000;
const FR_INST={fix:105000,fixLV:21000,puFix:11000,varDC:19000,dispVar:19000};
const FR_NET_OPEX={'1C':7200,'0.5C':4600};

function FR_autoCT(cp,hw){if(cp<=4)return 'MONO';return hw==='alpi'?'APU':'HPU';}
function FR_hwCap(ct,cp,gKVA){if(ct==='MONO')return Math.ceil(cp/2)*400;if(ct==='HPU')return Math.ceil(cp/8)*HPU_MAX;return alpiCfgBE(cp,gKVA||0).total;}
function FR_demand(cp,ptV,ct){return Math.min(cp*ptV,FR_hwCap(ct,cp));}
function FR_realKW(cp,avail,ct,gKVA){return Math.round(Math.min(avail,FR_hwCap(ct,cp,gKVA||0))/cp);}
function FR_puCount(ct,cp){if(ct==='MONO')return Math.ceil(cp/2);if(ct==='HPU')return Math.ceil(cp/8);return alpiCfgBE(cp).units;}
function FR_chHW(ct,cp,gKVA){
  if(ct==='MONO'){const u=Math.ceil(cp/2);return{hw:u*(u===1?HYC400_FULL:HYC400_STACKED),u,label:`${u}x HYC400`};}
  if(ct==='HPU'){const u=Math.ceil(cp/8);return{hw:u*HPU_UNIT+Math.ceil(cp/2)*DISP_HUA,u,label:`${u}x HPU + ${Math.ceil(cp/2)} disp`};}
  const c=alpiCfgBE(cp,gKVA||0);const hw_cost=c.n1000*APU_1000+c.n750*APU_750+Math.ceil(cp/2)*DISP_ALPI;

function FR_extPUCost(ct,iCP,fCP,iGrid,fGrid){

function FR_calcCX(cp,tf,gSub,ct,b){

  const bC=b.s==='bess_ok'&&b.mod?b.mod*(BESS_SPEC[b.ty].hw+BESS_SPEC[b.ty].inst):0;

function FR_findBest(cp,ct,hw,bOK,mx,mode){

  let bestNoBess=null;
  const tryNoBess=(list)=>{
    for(const tf of list){
      const gSub=targetGrid(tf,ct,cp,FR_gridSubsForTf(tf));
      if(gSub<need)continue;
      const cx=FR_calcCX(cp,tf,gSub,ct,{s:'no_bess'});const n10=cx.total;const score=mode==='reco'?cx.total:n10;
      if(!bestNoBess||score<(mode==='reco'?bestNoBess.capex:bestNoBess.net10))bestNoBess={tf,gSub,bess:{s:'no_bess'},capex:cx.total,net10:n10};
    }
  };
  tryNoBess(frStdTf);

  let bestBess=null;

    const tryBess=(list)=>{
      for(const tf of list){for(const gSub of FR_gridSubsForTf(tf)){

    {spots:12, hpu:{kw:104,config:"2\u00D7 HPU",bess:"no BESS",transfo:"MV 1 600",grid:"1 250 kW",code:"CZ-S12[12]-720HPU2-B0-T1600-G1250"}, apu:{kw:104,config:"2\u00D7 APU HYC1000",bess:"no BESS",transfo:"MV 1 600",grid:"1 250 kW",code:"CZ-S12[12]-1000APU2-B0-T1600-G1250"}},
    {spots:14, hpu:{kw:86,config:"2\u00D7 HPU",bess:"no BESS",transfo:"MV 1 600",grid:"1 200 kW",code:"CZ-S14[14]-720HPU2-B0-T1600-G1200"}, apu:{kw:85,config:"1\u00D7 APU HYC1000 + 1\u00D7 APU HYC750",bess:"no BESS",transfo:"MV 1 600",grid:"1 200 kW",code:"CZ-S14[14]-1000APU1-750APU1-B0-T1600-G1200"}},
    {spots:16, hpu:{kw:90,config:"2\u00D7 HPU",bess:"no BESS",transfo:"MV 1 600",grid:"1 600 kW",code:"CZ-S16[16]-720HPU2-B0-T1600-G1600"}, apu:{kw:100,config:"2\u00D7 APU HYC1000",bess:"no BESS",transfo:"MV 1 600",grid:"1 600 kW",code:"CZ-S16[16]-1000APU2-B0-T1600-G1600"}},
  ]},
};

const COL_META = { hpu:{label:"HUAWEI HPU", accent:"#0369a1"}, apu:{label:"ALPITRONIC APU", accent:"#7e22ce"} };

function bessBadgeStyle(bess){
  if(!bess || bess==="no BESS") return {bg:"#f1f5f9", fg:"#64748b", txt:"\u2014 no BESS"};
  if(bess.indexOf("1C")>-1 && bess.indexOf("0.5C")===-1) return {bg:"#fef3c7", fg:"#b45309", txt:bess};
  return {bg:"#f3e8ff", fg:"#7e22ce", txt:bess};
}
function transfoBadgeStyle(transfo){
  const isLV = transfo.indexOf("LV")>-1;
  return isLV ? {bg:"#e0f2fe", fg:"#0369a1"} : {bg:"#dcfce7", fg:"#15803d"};
}

function StdCell({ hw, accent }) {
  if(!hw) return <div style={{flex:1}}/>;
  const bs = bessBadgeStyle(hw.bess);
  const ts = transfoBadgeStyle(hw.transfo);
  return (
    <div style={{flex:1, minWidth:0, padding:"4px 8px"}}>
      <div style={{fontSize:10, fontWeight:700, letterSpacing:0.6, color:"#94a3b8", textTransform:"uppercase", marginBottom:4}}>
        {COL_META_LABEL(accent)}
      </div>
      <div style={{display:"flex", alignItems:"baseline", gap:4, marginBottom:8}}>
        <span style={{fontSize:26, fontWeight:800, color:"#0f172a", lineHeight:1}}>{hw.kw}</span>
        <span style={{fontSize:11, color:"#94a3b8", fontWeight:500}}>kW/s</span>
      </div>
      <div style={{display:"flex", flexWrap:"wrap", gap:5, alignItems:"center"}}>
        <span style={{fontSize:11, fontWeight:700, color:accent, background:accent+"14", border:"1px solid "+accent+"33", borderRadius:6, padding:"3px 8px"}}>{hw.config}</span>
        <span style={{fontSize:11, fontWeight:600, color:bs.fg, background:bs.bg, borderRadius:6, padding:"3px 8px"}}>{bs.txt}</span>
        <span style={{fontSize:11, fontWeight:700, color:ts.fg, background:ts.bg, borderRadius:6, padding:"3px 8px", display:"inline-flex", alignItems:"center", gap:3}}>
          <span style={{fontSize:10}}>⚡</span>{hw.transfo}
        </span>
        {hw.grid ? <span style={{fontSize:11, fontWeight:600, color:"#475569", background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:6, padding:"3px 8px"}}>{hw.grid}</span> : null}
      </div>
      <div style={{fontSize:9.5, fontFamily:"ui-monospace,SFMono-Regular,Menlo,monospace", color:"#94a3b8", marginTop:8, wordBreak:"break-all"}}>{hw.code}</div>
    </div>
  );
}
function COL_META_LABEL(accent){ return accent==="#0369a1" ? "HUAWEI" : "ALPITRONIC"; }

function StdConfigMatrix({ cc }) {
  const data = STD_CONFIG[cc];
  if(!data) return <div className="p-8 text-gray-400">No standard configuration for this country.</div>;
  const cols = data.cols;
  return (
    <div style={{padding:"24px 20px", maxWidth:1180, margin:"0 auto"}}>
      <div style={{display:"flex", alignItems:"center", justifyContent:"center", gap:14, marginBottom:6, position:"relative"}}>
        <div style={{position:"absolute", left:0, top:"50%", transform:"translateY(-50%)", fontSize:34, letterSpacing:2}}>{data.flags.join(" ")}</div>
        <h2 style={{fontSize:26, fontWeight:800, color:"#0f172a", textAlign:"center", margin:0}}>{data.title}</h2>
      </div>
      <div style={{textAlign:"center", color:"#94a3b8", fontSize:12, marginBottom:20}}>Standard set of configurations · Infrastructure Playbook</div>

      <div style={{display:"flex", padding:"0 8px 8px 74px", gap:8}}>
        <div style={{width:0, flex:"0 0 0"}}/>
        {cols.map(cid=>(
          <div key={cid} style={{flex:1, textAlign:"center", fontSize:12, fontWeight:800, letterSpacing:1, color:COL_META[cid].accent, textTransform:"uppercase"}}>{COL_META[cid].label}</div>
        ))}
        <div style={{width:150, flex:"0 0 150px", textAlign:"center", fontSize:11, fontWeight:700, letterSpacing:1, color:"#94a3b8", textTransform:"uppercase"}}>Notes</div>
      </div>

      <div style={{display:"flex", flexDirection:"column", gap:12}}>
        {data.rows.map(row=>(
          <div key={row.spots} style={{display:"flex", alignItems:"stretch", gap:8, background:"#fff", borderRadius:14, boxShadow:"0 1px 3px rgba(15,23,42,0.08), 0 1px 2px rgba(15,23,42,0.04)", overflow:"hidden", border:"1px solid #eef2f7"}}>
            <div style={{flex:"0 0 66px", background:"#0f172a", color:"#fff", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"18px 0"}}>
              <span style={{fontSize:24, fontWeight:800, lineHeight:1}}>{row.spots}</span>
              <span style={{fontSize:9, opacity:0.6, marginTop:2, textTransform:"uppercase", letterSpacing:0.5}}>spots</span>
            </div>
            {cols.map((cid,idx)=>(
              <React.Fragment key={cid}>
                {idx>0 && <div style={{width:1, background:"#eef2f7", flex:"0 0 1px", margin:"12px 0"}}/>}
                <StdCell hw={row[cid]} accent={COL_META[cid].accent}/>
              </React.Fragment>
            ))}
            <div style={{flex:"0 0 150px", padding:"10px 12px", borderLeft:"1px solid #eef2f7", display:"flex", alignItems:"center"}}>
              {row.note ? (
                <div style={{fontSize:10.5, color:"#64748b", lineHeight:1.5, display:"flex", gap:5}}>
                  <span style={{color:"#0891b2", flexShrink:0, fontWeight:700}}>◷</span><span>{row.note}</span>
                </div>
              ) : null}
            </div>
          </div>
        ))}
      </div>

      {data.footer ? (
        <div style={{marginTop:20, display:"flex", justifyContent:"flex-end"}}>
          <div style={{background:"#fef9c3", border:"1px solid #fde047", borderRadius:8, padding:"8px 14px", fontSize:12, fontWeight:600, color:"#854d0e"}}>{data.footer}</div>
        </div>
      ) : null}

      <div style={{marginTop:20, display:"flex", flexWrap:"wrap", gap:8, fontSize:11, color:"#64748b", alignItems:"center", justifyContent:"center"}}>
        <span style={{fontWeight:600, color:"#475569"}}>Legend:</span>
        <span style={{background:"#f3e8ff", color:"#7e22ce", borderRadius:6, padding:"3px 8px", fontWeight:600}}>0.5C BESS</span>
        <span style={{background:"#fef3c7", color:"#b45309", borderRadius:6, padding:"3px 8px", fontWeight:600}}>1C BESS</span>
        <span style={{background:"#dcfce7", color:"#15803d", borderRadius:6, padding:"3px 8px", fontWeight:600}}>⚡ MV transfo</span>
        <span style={{background:"#e0f2fe", color:"#0369a1", borderRadius:6, padding:"3px 8px", fontWeight:600}}>⚡ LV transfo</span>
      </div>
    </div>
  );
}


// ===============================================================================
// APP SHELL
// ===============================================================================
const COUNTRIES = [
  { id:'AT', label:'Austria',     flag:'\uD83C\uDDE6\uD83C\uDDF9', color:'#ed2939' },
  { id:'BE', label:'Belgium',     flag:'\uD83C\uDDE7\uD83C\uDDEA', color:'#fdda24' },
  { id:'CH', label:'Switzerland', flag:'\uD83C\uDDE8\uD83C\uDDED', color:'#d52b1e' },
  { id:'ES', label:'Spain',       flag:'\uD83C\uDDEA\uD83C\uDDF8', color:'#f1bf00' },
  { id:'IT', label:'Italy',       flag:'\uD83C\uDDEE\uD83C\uDDF9', color:'#008c45' },
  { id:'FR', label:'France',      flag:'\uD83C\uDDEB\uD83C\uDDF7', color:'#0055a4' },
  { id:'DE', label:'Germany',     flag:'\uD83C\uDDE9\uD83C\uDDEA', color:'#000000' },
  { id:'NL', label:'Netherlands', flag:'\uD83C\uDDF3\uD83C\uDDF1', color:'#ff6b00', configOnly:true },
  { id:'CZ', label:'Czech Rep.',  flag:'\uD83C\uDDE8\uD83C\uDDFF', color:'#11457e', configOnly:true },
];

// Configuration Matrix tab now renders the standard-config tables from the Playbook.
const MATRIX = { AT:StdMatrixAT, BE:StdMatrixBE, CH:StdMatrixCH, ES:StdMatrixES, IT:StdMatrixIT, FR:StdMatrixFR, DE:StdMatrixDE, NL:StdMatrixNL, CZ:StdMatrixCZ };
const CONFIG = { AT:AT_Configurator, BE:BE_Configurator, CH:CH_Configurator, ES:ES_Configurator, IT:IT_Configurator, FR:FR_Configurator, DE:DE_Configurator };
const versions = { AT:'v33.1', BE:'v33.1', CH:'v33.1', ES:'v33.1', IT:'v33.1', FR:'v33.1', DE:'v33.1', NL:'v33.1', CZ:'v33.1' };
const APP_VERSION = '2.1'; // Configurator tool version - bump on future feature/logic releases

// thin wrappers so the dispatch stays declarative
function StdMatrixAT(){return <StdConfigMatrix cc="AT"/>;}
function StdMatrixBE(){return <StdConfigMatrix cc="BE"/>;}
function StdMatrixCH(){return <StdConfigMatrix cc="CH"/>;}
function StdMatrixES(){return <StdConfigMatrix cc="ES"/>;}
function StdMatrixIT(){return <StdConfigMatrix cc="IT"/>;}
function StdMatrixFR(){return <StdConfigMatrix cc="FR"/>;}
function StdMatrixDE(){return <StdConfigMatrix cc="DE"/>;}
function StdMatrixNL(){return <StdConfigMatrix cc="NL"/>;}
function StdMatrixCZ(){return <StdConfigMatrix cc="CZ"/>;}

function App() {
  const [country,setCountry]=useState('AT');
  const [tab,setTab]=useState('config');
  const meta=COUNTRIES.find(c=>c.id===country);
  const hasConfigurator=!!CONFIG[country] && !meta.configOnly;
  const effTab=hasConfigurator?tab:'matrix';
  const Matrix=MATRIX[country];const Config=CONFIG[country];
  const selectCountry=(id)=>{
    const m=COUNTRIES.find(c=>c.id===id);
    setCountry(id);
    if(m && (m.configOnly || !CONFIG[id])) setTab('matrix');
  };
  return (
    <div style={{fontFamily:'system-ui,-apple-system,Segoe UI,Roboto,sans-serif',minHeight:'100vh',background:'#f1f5f9'}}>
      <div style={{background:'#0f172a',color:'#fff',padding:'14px 20px'}} className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-3">
          <div style={{fontWeight:800,fontSize:18,letterSpacing:0.5}}>ELECTRA</div>
          <div style={{opacity:0.6,fontSize:13}}>Station Configurator v{APP_VERSION} - BP {versions[country]}</div>
        </div>
        <div className="flex flex-wrap gap-1.5">
          {COUNTRIES.map(c=>(
            <button key={c.id} onClick={()=>selectCountry(c.id)}
              className={"px-3 py-1.5 rounded-lg text-xs font-bold transition "+(country===c.id?"":"opacity-60 hover:opacity-100")}
              style={{background:country===c.id?c.color:'#1e293b',color:country===c.id&&(c.color==='#fdda24'||c.color==='#f1bf00')?'#000':'#fff',border:country===c.id?'2px solid #fff':'2px solid transparent'}}>
              {c.flag} {c.label}
            </button>
          ))}
        </div>
      </div>
      <div style={{background:'#fff',borderBottom:'1px solid #e2e8f0',padding:'0 20px'}} className="flex gap-1 items-center">
        {[...(hasConfigurator?[['config','Station Configurator']]:[]),['matrix','Configuration Matrix']].map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)}
            className="px-4 py-2.5 text-sm font-semibold"
            style={{color:effTab===id?'#0f172a':'#94a3b8',borderBottom:effTab===id?'3px solid #0f172a':'3px solid transparent',marginBottom:-1}}>
            {label}
          </button>
        ))}
        {!hasConfigurator && <span style={{marginLeft:'auto',fontSize:11,color:'#94a3b8',fontStyle:'italic'}}>Standard configurations only</span>}
      </div>
      <div className="max-w-full">
        {effTab==='matrix'?<Matrix/>:<Config/>}
      </div>
      <div style={{textAlign:'center',color:'#94a3b8',fontSize:11,padding:'16px'}}>
        Electra Station Configurator v{APP_VERSION} - {COUNTRIES.find(c=>c.id===country)?.label} - Business Plan {versions[country]}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
